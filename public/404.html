<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Youth Arabská</title>
  <!--
    GitHub Pages SPA Routing Fix
    When GitHub Pages returns 404 for a deep-link (e.g. /horizont),
    this page encodes the path into a redirect URL so the React app
    can recover the route on load. Technique by rafgraph.
    https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    var segmentCount = 1; // number of path segments in the repo name (/YouthArabskaWeb)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
